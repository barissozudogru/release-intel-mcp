<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px;
    height: 640px;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, #1E1B4B 0%, #312E81 40%, #4C1D95 100%);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: white;
    position: relative;
    overflow: hidden;
  }

  /* Dot grid overlay */
  .pattern {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  /* Subtle glow */
  .glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    pointer-events: none;
  }

  .glow-2 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(167,139,250,0.1) 0%, transparent 70%);
    bottom: -80px;
    left: -80px;
    pointer-events: none;
  }

  /* Accent line at top */
  .accent-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #8B5CF6, #A78BFA, #C4B5FD, #A78BFA, #8B5CF6);
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 0 80px;
    display: flex;
    align-items: center;
    gap: 48px;
    width: 100%;
  }

  .logo {
    flex-shrink: 0;
  }

  .text {
    flex: 1;
  }

  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(139,92,246,0.2);
    border: 1px solid rgba(139,92,246,0.3);
    font-size: 13px;
    font-weight: 600;
    color: #C4B5FD;
    letter-spacing: 0.5px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .tagline {
    font-size: 20px;
    font-weight: 400;
    color: rgba(255,255,255,0.6);
    line-height: 1.5;
    margin-bottom: 32px;
    max-width: 600px;
  }

  .features {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pill {
    padding: 6px 14px;
    border-radius: 16px;
    background: rgba(139,92,246,0.15);
    font-size: 13px;
    color: #C4B5FD;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="pattern"></div>
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="accent-line"></div>

  <div class="content">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="160" height="160">
        <polygon points="64,64 36,15.5 92,15.5" fill="#A78BFA" opacity="0.95"/>
        <polygon points="64,64 92,15.5 120,64" fill="#8B5CF6" opacity="0.95"/>
        <polygon points="64,64 120,64 92,112.5" fill="#7C3AED" opacity="0.95"/>
        <polygon points="64,64 92,112.5 36,112.5" fill="#6D28D9" opacity="0.90"/>
        <polygon points="64,64 36,112.5 8,64" fill="#7C3AED" opacity="0.92"/>
        <polygon points="64,64 8,64 36,15.5" fill="#A78BFA" opacity="0.88"/>
        <polygon points="120,64 92,112.5 36,112.5 8,64 36,15.5 92,15.5"
                 fill="none" stroke="#4C1D95" stroke-width="1" opacity="0.3"/>
        <line x1="64" y1="64" x2="120" y2="64" stroke="#4C1D95" stroke-width="0.5" opacity="0.2"/>
        <line x1="64" y1="64" x2="92" y2="112.5" stroke="#4C1D95" stroke-width="0.5" opacity="0.2"/>
        <line x1="64" y1="64" x2="36" y2="112.5" stroke="#4C1D95" stroke-width="0.5" opacity="0.2"/>
        <line x1="64" y1="64" x2="8" y2="64" stroke="#4C1D95" stroke-width="0.5" opacity="0.2"/>
        <line x1="64" y1="64" x2="36" y2="15.5" stroke="#4C1D95" stroke-width="0.5" opacity="0.2"/>
        <line x1="64" y1="64" x2="92" y2="15.5" stroke="#4C1D95" stroke-width="0.5" opacity="0.2"/>
        <path d="M64,34 L84,58 L72,58 L72,94 L56,94 L56,58 L44,58 Z" fill="white" opacity="0.95"/>
      </svg>
    </div>

    <div class="text">
      <div class="badge">MCP Server</div>
      <h1>release-intel-mcp</h1>
      <div class="tagline">
        Release intelligence from GitHub data. Correlates commits, PRs, issues, and contributors between git refs.
      </div>
      <div class="features">
        <span class="pill">Commit Analysis</span>
        <span class="pill">PR Categorization</span>
        <span class="pill">Issue Linking</span>
        <span class="pill">Changelog Generation</span>
        <span class="pill">Contributor Stats</span>
      </div>
    </div>
  </div>
</body>
</html>
